<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc">
<title id="title">Silencio GitHub profile — four-section terminal layout</title>
<desc id="desc">A dark terminal frame with a slim header, artwork pane on the left, identity pane on the right, and a footer status strip. Text is temporary and the sections are intentionally empty.</desc>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace}
  .label{font-size:13px;font-weight:500;letter-spacing:2px;fill:#a1a2a8}
  .sub{font-size:15px;fill:#6e717b}
</style>
<rect width="1000" height="520" fill="#000000"/>
<rect x="1" y="1" width="998" height="518" rx="13" fill="#000000" stroke="#41434b" stroke-width="1.5"/>
<!-- Layout boundaries: header 9%, main 79%, status 12%; main 38/62 split -->
<path d="M1 47.8 H999 M1 458.6 H999 M380 47.8 V458.6" stroke="#41434b" stroke-width="1.5" fill="none"/>
<!-- header is deliberately undecided; no window-control style chosen -->
<!-- header prompt -->
<text x="28" y="22" class="mono" font-size="18" fill="#6ee7f2">~</text>
<text x="28" y="39" class="mono" font-size="18" fill="#8fbf26">❯</text>
<text x="52" y="39" class="mono" font-size="15" fill="#d6d6db">fastfetch</text>
<text x="875" y="29" class="mono" font-size="15" fill="#7a7d86">11:46</text>

<!-- RIGHT ART TRIAL: floating monolith -->
<defs>
  <clipPath id="rMonolithPane"><rect x="381" y="49" width="617" height="408"/></clipPath>
  <radialGradient id="rMonoHalo" cx="50%" cy="54%" r="49%">
    <stop offset="0" stop-color="#455465" stop-opacity="0.25"/>
    <stop offset="0.43" stop-color="#1c2635" stop-opacity="0.11"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rMonoFront" x1="0" y1="0" x2="1" y2="0.8">
    <stop offset="0" stop-color="#222935"/>
    <stop offset="0.27" stop-color="#11151e"/>
    <stop offset="0.73" stop-color="#0b0e15"/>
    <stop offset="1" stop-color="#050607"/>
  </linearGradient>
  <linearGradient id="rMonoLeft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#647184"/>
    <stop offset="0.15" stop-color="#333b4b"/>
    <stop offset="0.86" stop-color="#13151c"/>
    <stop offset="1" stop-color="#050607"/>
  </linearGradient>
  <linearGradient id="rMonoTop" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#858c95"/>
    <stop offset="0.5" stop-color="#515a68"/>
    <stop offset="1" stop-color="#252c38"/>
  </linearGradient>
  <radialGradient id="rMonoShadow">
    <stop stop-color="#8797ac" stop-opacity=".16"/>
    <stop offset="1" stop-color="#8797ac" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#rMonolithPane)" opacity="0.5">
  <ellipse cx="698" cy="270" rx="211" ry="194" fill="url(#rMonoHalo)"/>
  <ellipse cx="695" cy="400" rx="126" ry="20" fill="url(#rMonoShadow)"/>
  <g fill="none" stroke="#4f5e6d">
    <ellipse cx="695" cy="282" rx="141" ry="48" transform="rotate(-18 695 282)" stroke-opacity=".24" stroke-dasharray="2 7"/>
    <ellipse cx="699" cy="279" rx="170" ry="74" transform="rotate(22 699 279)" stroke-opacity=".13" stroke-dasharray="1 9"/>
  </g>
  <!-- Suspended shards -->
  <path d="M553 275 L561 255 L568 263 L562 287 Z" fill="#1b232f" stroke="#6a7381" stroke-width=".8"/>
  <path d="M817 218 L826 202 L833 220 L825 228 Z" fill="#1e2530" stroke="#848c97" stroke-width=".8"/>
  <path d="M801 358 L810 353 L815 363 L805 369 Z" fill="#1a202b" stroke="#65717d" stroke-width=".7"/>
  <path d="M600 168 L605 159 L610 167 L605 174 Z" fill="#37404b" stroke="#677581" stroke-width=".6"/>
  <!-- Main structure: top, left and front facets -->
  <path d="M654 183 L721 161 L756 194 L690 218 Z" fill="url(#rMonoTop)" stroke="#7e8995" stroke-width="1.2"/>
  <path d="M654 183 L690 218 L688 383 L642 353 Z" fill="url(#rMonoLeft)" stroke="#6b7582" stroke-width="1.2"/>
  <path d="M690 218 L756 194 L748 359 L688 383 Z" fill="url(#rMonoFront)" stroke="#808893" stroke-width="1.3"/>
  <!-- Fine fractures and reflected edge light -->
  <path d="M657 190 L691 219 L690 374" fill="none" stroke="#bcc4cb" stroke-width="1" opacity=".62"/>
  <path d="M752 199 L745 351 L691 375" fill="none" stroke="#586473" stroke-width=".75" opacity=".86"/>
  <path d="M702 225 L707 272 L699 286 L708 302 L703 347" fill="none" stroke="#4c596b" stroke-width=".65" opacity=".66"/>
  <path d="M725 214 L721 255 L733 281 L727 317" fill="none" stroke="#4c5668" stroke-width=".65" opacity=".55"/>
  <path d="M661 224 L668 247 L659 286 L678 306 L669 348" fill="none" stroke="#99a5ae" stroke-width=".55" opacity=".22"/>
  <path d="M660 192 L684 213 M717 168 L744 191" fill="none" stroke="#f0ece2" stroke-width=".8" opacity=".38"/>
  <!-- Very fine base reflections -->
  <path d="M627 403 H758 M665 410 H720" stroke="#b3bac6" opacity=".12" stroke-width="1"/>
  <g fill="#acb4bc" opacity=".54">
    <circle cx="541" cy="240" r="1.2"/><circle cx="851" cy="280" r="1"/><circle cx="615" cy="359" r=".9"/>
    <circle cx="775" cy="169" r="1.2"/><circle cx="593" cy="310" r=".6"/><circle cx="790" cy="393" r=".7"/>
  </g>
</g>
<!-- END RIGHT ART TRIAL -->
<text x="26" y="91" class="mono label">02  /  ART PANE</text>
<text x="26" y="121" class="mono sub">[ ASCII ART / CHARACTER ]</text>
<!-- Identity: whoami -->
<text x="410" y="101"
      font-family="ui-monospace,Consolas,monospace"
      font-size="15">
  <tspan fill="#8fbf26">$</tspan>
  <tspan fill="#9699a1" font-size="14"> whoami</tspan>
</text>
<text x="410" y="132"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="17.5"
      font-style="italic"
      fill="#ddd6cb">consigliere</text>
<!-- Consigliere's philosophy -->
<text x="410" y="149"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="12"
      font-style="italic"
      fill="#555555">There is always another way.</text>
<text x="26" y="492" class="mono label">04  /  STATUS STRIP</text>
<text x="762" y="492" class="mono sub">[ PENDING ]</text>
</svg>
